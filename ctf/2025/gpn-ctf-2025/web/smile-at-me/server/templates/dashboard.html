{% extends 'base.html' %}
{% block content %}
<div>
  <aside>
    <h3>My Notes</h3>
    <ul>{% for nid, title in user_notes %}<li><a href="{{url_for('view_note', note_id=nid)}}">{{title}}</a></li>{% endfor %}</ul>
    <p><a href="{{url_for('new_note')}}">New Note</a></p>
  </aside>
  <main>{% if not user_notes %}<p>No notes yet.</p>{% else %}<h2>Welcome, {{current_user}}</h2><p>Select a note or create a new one.</p>{% endif %}</main>
</div>
{% endblock %}
